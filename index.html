        const SmartImportView = ({ userSchool, onBatch, onApiSuccess, onApiError }) => {
            const [text, setText] = useState('');
            const [loading, setLoading] = useState(false);
            const [sport, setSport] = useState("Boys Basketball");
            const [extracted, setExtracted] = useState(null);

            const handleAI = async () => {
                if (!GEMINI_API_KEY) {
                    onApiError();
                    alert("Developer Error: You must paste your Gemini API Key into index.html before using the AI features.");
                    return;
                }

                setLoading(true);
                const cats = SPORTS_CATEGORIES[sport].join(', ');
                const prompt = `Extract player names and their stats for ${sport} from this data. Map them to these exact categories: ${cats}. Return ONLY a JSON array of objects with playerName and stats object. Example: [{"playerName": "Smith", "stats": {"Points": 15}}]`;
                
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Raw Data: ${text}\n\nTask: ${prompt}` }] }] })
                    });
                    
                    const data = await res.json();
                    
                    if (data.error) {
                        throw new Error(data.error.message || "API Key Invalid or Usage Limit Reached.");
                    }

                    const clean = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '');
                    const parsed = JSON.parse(clean);
                    let flat = [];
                    parsed.forEach(p => {
                        Object.entries(p.stats).forEach(([k, v]) => {
                            flat.push({ playerName: p.playerName, category: k, value: v, school: userSchool, sport: sport, season: '2025-2026' });
                        });
                    });
                    setExtracted(flat);
                    onApiSuccess();
                } catch (e) { 
                    onApiError();
                    alert("AI Sync Error: " + e.message); 
                }
                setLoading(false);
            };

            return (
                <div className="p-4 sm:p-8 max-w-4xl mx-auto">
                    <h2 className="text-3xl font-extrabold text-blue-900 mb-6 uppercase italic">AI Smart Import</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-xl border border-gray-200">
                        <label className="block text-xs font-black text-gray-400 uppercase mb-2">Select Sport Target</label>
                        <select className="w-full border p-3 rounded-lg mb-4 font-bold" value={sport} onChange={e => setSport(e.target.value)}>{Object.keys(SPORTS_CATEGORIES).map(s => <option key={s} value={s}>{s}</option>)}</select>
                        <label className="block text-xs font-black text-gray-400 uppercase mb-2">Paste Game Summary or Box Score</label>
                        <textarea className="w-full border p-4 rounded-lg min-h-[250px] mb-4 text-sm font-medium" placeholder="E.g. Johnson led Scranton with 24 points..." value={text} onChange={e => setText(e.target.value)} />
                        <button onClick={handleAI} disabled={loading || !text} className="w-full bg-blue-900 text-white font-black py-4 rounded-xl uppercase tracking-widest disabled:opacity-50 hover:bg-blue-800 shadow-lg">
                            {loading ? <Icon name="circle-notch" className="animate-spin mr-2"/> : <Icon name="wand-sparkles" className="mr-2"/>}
                            Clean & Match with AI
                        </button>
                    </div>

                    {extracted && (
                        <div className="mt-8 bg-white p-6 rounded-2xl shadow-2xl border-t-8 border-green-500">
                            <h3 className="font-black text-lg mb-4 uppercase text-gray-800">Review {extracted.length} Extracted Entries</h3>
                            <div className="max-h-[300px] overflow-y-auto mb-6 border rounded-lg p-2 bg-gray-50">
                                {extracted.map((e, i) => <div key={i} className="text-sm py-2 border-b last:border-0 font-bold">{e.playerName}: <span className="text-blue-600">{e.value}</span> {e.category}</div>)}
                            </div>
                            <button onClick={() => {onBatch(extracted); setExtracted(null); setText('');}} className="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase shadow-lg hover:bg-green-700">Commit to SportzWire Database</button>
                        </div>
                    )}
                </div>
            );
        };

        const PortalView = ({ stats, schedules, adAccounts, role, userSchool, onSave, onDelete }) => {
            const [tab, setTab] = useState('stats');

            const [af, setAF] = useState({ id: '', school: SCHOOLS[0], email: '', password: '', status: 'active' });

            const sStat = (e) => { e.preventDefault(); onSave('stats', f); setF({...f, id: '', playerName: '', value: ''}); };
            const sAd = (e) => { e.preventDefault(); onSave('adAccounts', af); setAF({ id: '', school: SCHOOLS[0], email: '', password: '', status: 'active' }); };

            return (

                        {role === 'admin' && <button onClick={() => setTab('ads')} className={`px-6 py-2 font-black rounded-lg uppercase text-xs tracking-widest ${tab === 'ads' ? 'bg-blue-900 text-white shadow-lg' : 'bg-white border text-gray-500'}`}>Accounts</button>}
                    </div>

                    {tab === 'stats' && (
                        <div className="space-y-6">

                                <input className="border p-3 rounded-lg font-bold" placeholder="Player Name" value={f.playerName} onChange={e => setF({...f, playerName: e.target.value})} required />
                                <select className="border p-3 rounded-lg font-bold" value={f.sport} onChange={e => setF({...f, sport: e.target.value})}>{Object.keys(SPORTS_CATEGORIES).map(s => <option key={s} value={s}>{s}</option>)}</select>
                                <input className="border p-3 rounded-lg font-bold" type="number" placeholder="Value" value={f.value} onChange={e => setF({...f, value: e.target.value})} required />

                            <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
                                <table className="w-full text-left text-sm">

                                        <tr><th className="p-4">School</th><th className="p-4">Sport</th><th className="p-4">Player</th><th className="p-4">Val</th><th className="p-4"></th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {filtered.sort((a,b) => b.value - a.value).map(s => (
                                            <tr key={s.id}>
                                                <td className="p-4 text-xs font-black uppercase text-gray-400">{s.school}</td><td className="p-4 text-xs font-black uppercase text-gray-400">{s.sport}</td><td className="p-4 font-bold">{s.playerName}</td><td className="p-4 font-black text-blue-700">{s.value}</td>
                                                <td className="p-4 text-right"><button onClick={() => onDelete('stats', s.id)} className="text-red-500 hover:text-red-700"><Icon name="trash-can" /></button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {tab === 'ads' && role === 'admin' && (
                        <div className="space-y-6">
                            <form onSubmit={sAd} className="bg-white p-6 rounded-2xl shadow-md grid grid-cols-1 md:grid-cols-3 gap-4">
                                <select className="border p-3 rounded-lg font-bold" value={af.school} onChange={e => setAF({...af, school: e.target.value})}>{SCHOOLS.map(s => <option key={s} value={s}>{s}</option>)}</select>
                                <input className="border p-3 rounded-lg font-bold" type="email" placeholder="Work Email" value={af.email} onChange={e => setAF({...af, email: e.target.value})} required />
                                <div className="flex gap-2">
                                    <input className="border p-3 rounded-lg font-bold flex-1" placeholder="Password" value={af.password} onChange={e => setAF({...af, password: e.target.value})} required />
                                    <button type="button" onClick={() => setAF({...af, password: Math.random().toString(36).slice(-8)})} className="bg-gray-100 px-4 rounded-lg font-black text-xs uppercase">Gen</button>
                                </div>
                                <button className="md:col-span-3 bg-blue-900 text-white font-black uppercase py-4 rounded-xl shadow-lg">Save AD Access</button>
                            </form>
                            <div className="bg-white rounded-2xl shadow-xl overflow-hidden border">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-gray-50 border-b text-[10px] uppercase font-black text-gray-400"><tr><th className="p-4">School</th><th className="p-4">Email</th><th className="p-4">Status</th></tr></thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {adAccounts.map(a => (
                                            <tr key={a.id}>
                                                <td className="p-4 font-black text-blue-900">{a.school}</td><td className="p-4 text-blue-600 font-bold">{a.email}</td><td className="p-4"><span className="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-black uppercase">{a.status}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Core Application ---

        function App() {
            const [view, setView] = useState('home');
            const [user, setUser] = useState(null);
            const [apiStatus, setApiStatus] = useState(GEMINI_API_KEY ? 'active' : 'error');
            const [stats, setStats] = useState([]);
            const [schedules, setSchedules] = useState([]);
            const [adAccounts, setAdAccounts] = useState([]);
            const [modal, setModal] = useState(false);
            const [email, setEmail] = useState('');
            const [pass, setPass] = useState('');

            const { initializeApp, getAuth, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc } = window.FirebaseSDK;
            const db = getFirestore(initializeApp(firebaseConfig));
            const auth = getAuth();

            useEffect(() => {
                signInAnonymously(auth);
                onAuthStateChanged(auth, u => setUser(u));
            }, []);

            useEffect(() => {
                if (!user) return;
                const u1 = onSnapshot(collection(db, 'stats'), s => setStats(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const u2 = onSnapshot(collection(db, 'schedules'), s => setSchedules(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const u3 = onSnapshot(collection(db, 'adAccounts'), s => setAdAccounts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { u1(); u2(); u3(); };
            }, [user]);

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                    setModal(false);
                } catch (err) {
                    if (email === 'admin@sportzwire.com') {
                        try {
                            await createUserWithEmailAndPassword(auth, email, pass);
                            setModal(false);
                        } catch (e) { alert("Admin setup failed."); }
                    } else { alert("Invalid Portal Credentials."); }
                }
            };

            const handleSave = async (col, d) => await addDoc(collection(db, col), d);
            const handleDelete = async (col, id) => await deleteDoc(doc(db, col, id));
            const handleBatch = async (arr) => {
                await Promise.all(arr.map(a => addDoc(collection(db, 'stats'), a)));
                alert("Database Updated!");
            };

            let role = 'public';
            let school = SCHOOLS[0];
            if (user && !user.isAnonymous) {
                if (user.email === 'admin@sportzwire.com') role = 'admin';
                else {
                    const match = adAccounts.find(a => a.email.toLowerCase() === user.email.toLowerCase());
                    if (match) { role = 'ad'; school = match.school; }
                }
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-blue-900 text-white p-4 shadow-2xl border-b-4 border-blue-600">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer mb-4 md:mb-0" onClick={() => setView('home')}>
                                <div className="bg-white text-blue-900 p-2 rounded-lg font-black italic shadow-inner tracking-tighter">SW</div>
                                <div className="leading-none">
                                    <div className="flex items-center gap-2">
                                        <span className="text-3xl font-black italic uppercase tracking-tighter block">SportzWire</span>
                                        <div title={apiStatus === 'active' ? "AI API Active" : "AI API Missing or Error"} className={`w-3 h-3 rounded-full ${apiStatus === 'active' ? 'bg-green-400 shadow-[0_0_8px_#4ade80]' : 'bg-red-500 shadow-[0_0_8px_#ef4444]'}`}></div>
                                    </div>
                                    <span className="text-[10px] font-black text-blue-400 uppercase tracking-[0.2em] ml-0.5">District 2 Hub</span>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2 md:gap-4 font-black uppercase text-[10px] tracking-widest items-center">
                                <button onClick={() => setView('home')} className={`px-3 py-2 rounded-lg ${view === 'home' ? 'bg-blue-800 shadow-inner' : 'hover:text-blue-300'}`}>School Stats</button>
                                <button onClick={() => setView('top20')} className={`px-3 py-2 rounded-lg ${view === 'top20' ? 'bg-blue-800 shadow-inner' : 'hover:text-blue-300'}`}>Leaderboards</button>
                                {role !== 'public' && (
                                    <>
                                        <button onClick={() => setView('import')} className={`px-3 py-2 rounded-lg text-green-400 ${view === 'import' ? 'bg-blue-800' : ''}`}>AI Import</button>
                                        <button onClick={() => setView('staff')} className={`px-3 py-2 rounded-lg text-blue-300 ${view === 'staff' ? 'bg-blue-800' : ''}`}>AD Portal</button>
                                    </>
                                )}
                                {user && !user.isAnonymous ? 
                                    <button onClick={() => signOut(auth)} className="bg-red-700 px-4 py-2 rounded-lg shadow-lg font-black ml-2">Log Out</button> :
                                    <button onClick={() => setModal(true)} className="bg-blue-600 px-4 py-2 rounded-lg shadow-lg font-black ml-2 hover:bg-blue-500">Staff Login</button>
                                }
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow">
                        {view === 'home' && <SchoolLookupView stats={stats} schedules={schedules} />}
                        {view === 'top20' && <Top20View stats={stats} />}
                        {view === 'import' && <SmartImportView userSchool={school} onBatch={handleBatch} onApiSuccess={() => setApiStatus('active')} onApiError={() => setApiStatus('error')} />}
                        {view === 'staff' && <PortalView stats={stats} schedules={schedules} adAccounts={adAccounts} role={role} userSchool={school} onSave={handleSave} onDelete={handleDelete} />}
                    </main>

                    {modal && (
                        <div className="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center p-4 z-[200]">
                            <div className="bg-white p-8 rounded-3xl max-w-sm w-full shadow-2xl border-4 border-blue-900">
                                <h2 className="text-4xl font-black text-blue-900 mb-6 uppercase italic tracking-tighter text-center">Portal</h2>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <input className="w-full border-2 border-gray-200 p-4 rounded-xl font-bold focus:border-blue-500 outline-none" type="email" placeholder="School Email" value={email} onChange={e => setEmail(e.target.value)} required />
                                    <input className="w-full border-2 border-gray-200 p-4 rounded-xl font-bold focus:border-blue-500 outline-none" type="password" placeholder="Password" value={pass} onChange={e => setPass(e.target.value)} required />
                                    <button className="w-full bg-blue-900 text-white font-black py-5 rounded-2xl uppercase tracking-[0.2em] hover:bg-blue-800 transition-all shadow-xl">Secure Login</button>
                                    <button type="button" onClick={() => setModal(false)} className="w-full text-gray-400 font-black uppercase text-[10px] tracking-widest mt-4">Close Access</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
