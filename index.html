<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportzWire | District 2 Stats Hub</title>
    <!-- React & Babel for Browser Rendering -->

    <script type="module">

        // Push SDK to window so Babel script can see it
        window.FirebaseSDK = { initializeApp, getAuth, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc };
    </script>

    </style>
</head>
<body class="bg-gray-100">

    <script type="text/babel">

        const firebaseConfig = {

            appId: "1:935315477435:web:02d073ddefc1a5472cea9e",

        };

        const SPORTS_CATEGORIES = {

        // --- Helper: App Icon ---
        const Icon = ({ name, className = "" }) => <i className={`fa-solid fa-${name} ${className}`}></i>;

        // --- Views ---

        const Top20View = ({ stats }) => {
            const [sport, setSport] = useState("Boys Basketball");
            const [season, setSeason] = useState("2025-2026");

            return (
                <div className="p-4 sm:p-8 max-w-7xl mx-auto">
                    <h2 className="text-3xl font-extrabold text-blue-900 mb-6 uppercase tracking-tight">District 2 Leaderboards</h2>
                    <div className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-8 flex flex-wrap gap-4">
                        <select className="border p-2 rounded font-bold" value={sport} onChange={e => setSport(e.target.value)}>
                            {Object.keys(SPORTS_CATEGORIES).map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                        <select className="border p-2 rounded font-bold" value={season} onChange={e => setSeason(e.target.value)}>
                            {SEASONS.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        {SPORTS_CATEGORIES[sport].map(cat => {
                            const top = stats
                                .filter(s => s.sport === sport && s.category === cat && (season === "All-Time" || s.season === season))
                                .sort((a,b) => Number(b.value) - Number(a.value))
                                .slice(0, 20);
                            return (
                                <div key={cat} className="bg-white p-5 rounded-xl shadow-md border-t-4 border-blue-600">
                                    <h3 className="font-bold text-lg mb-4 border-b pb-1">{cat}</h3>
                                    {top.length === 0 ? <p className="text-gray-400 italic text-sm">No entries yet.</p> : (
                                        <ul className="space-y-2">
                                            {top.map((p, i) => (
                                                <li key={i} className="flex justify-between items-center text-sm">
                                                    <div className="truncate pr-2">
                                                        <span className="font-bold mr-1 text-gray-400">{i+1}.</span>
                                                        <span className="font-bold text-gray-800">{p.playerName}</span>
                                                        <p className="text-[10px] text-gray-500 uppercase font-semibold">{p.school}</p>
                                                    </div>
                                                    <span className="font-black text-blue-700 bg-blue-50 px-2 py-0.5 rounded">{p.value}</span>
                                                </li>
                                            ))}

                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const SchoolLookupView = ({ stats, schedules }) => {
            const [school, setSchool] = useState(SCHOOLS[0]);
            const [sport, setSport] = useState("Boys Basketball");
            const [season, setSeason] = useState("2025-2026");

            const filteredStats = stats.filter(s => s.school === school && s.sport === sport && (season === "All-Time" || s.season === season));
            const filteredSched = schedules.filter(s => s.school === school && s.sport === sport && (season === "All-Time" || s.season === season));

            return (
                <div className="p-4 sm:p-8 max-w-6xl mx-auto">
                    <div className="bg-white p-6 rounded-xl shadow-md border border-gray-200 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label className="block text-xs font-black text-gray-400 uppercase mb-1">Select School</label>
                            <select className="w-full border p-2 rounded font-bold" value={school} onChange={e => setSchool(e.target.value)}>
                                {SCHOOLS.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-black text-gray-400 uppercase mb-1">Select Sport</label>
                            <select className="w-full border p-2 rounded font-bold" value={sport} onChange={e => setSport(e.target.value)}>
                                {Object.keys(SPORTS_CATEGORIES).map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-black text-gray-400 uppercase mb-1">Season</label>
                            <select className="w-full border p-2 rounded font-bold" value={season} onChange={e => setSeason(e.target.value)}>
                                {SEASONS.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <section>
                            <h3 className="text-xl font-black text-blue-900 mb-4 uppercase flex items-center gap-2">
                                <Icon name="chart-simple" /> Player Statistics
                            </h3>
                            <div className="bg-white rounded-xl shadow-md overflow-hidden">
                                <table className="w-full text-left">
                                    <thead className="bg-gray-50 border-b">
                                        <tr><th className="p-4 text-xs font-bold uppercase text-gray-500">Player</th><th className="p-4 text-xs font-bold uppercase text-gray-500">Category</th><th className="p-4 text-right text-xs font-bold uppercase text-gray-500">Val</th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {filteredStats.length === 0 ? <tr><td colSpan="3" className="p-8 text-center text-gray-400 italic">No stats found.</td></tr> : 
                                            filteredStats.map(s => (
                                                <tr key={s.id} className="hover:bg-gray-50">
                                                    <td className="p-4 font-bold">{s.playerName}</td>
                                                    <td className="p-4 text-sm text-gray-600">{s.category}</td>
                                                    <td className="p-4 text-right font-black text-blue-700">{s.value}</td>
                                                </tr>
                                            ))
                                        }
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        <section>
                            <h3 className="text-xl font-black text-blue-900 mb-4 uppercase flex items-center gap-2">
                                <Icon name="calendar-days" /> Schedule & Results
                            </h3>
                            <div className="bg-white rounded-xl shadow-md overflow-hidden">
                                <table className="w-full text-left">
                                    <thead className="bg-gray-50 border-b">
                                        <tr><th className="p-4 text-xs font-bold uppercase text-gray-500">Date</th><th className="p-4 text-xs font-bold uppercase text-gray-500">Opponent</th><th className="p-4 text-right text-xs font-bold uppercase text-gray-500">Result</th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {filteredSched.length === 0 ? <tr><td colSpan="3" className="p-8 text-center text-gray-400 italic">No games posted.</td></tr> : 
                                            filteredSched.map(g => (
                                                <tr key={g.id}>
                                                    <td className="p-4 font-bold text-sm">{g.date}</td>
                                                    <td className="p-4 text-sm">{g.opponent} <span className="text-[10px] bg-gray-100 px-1 rounded">{g.location}</span></td>
                                                    <td className="p-4 text-right font-black text-blue-700">{g.result}</td>
                                                </tr>
                                            ))
                                        }
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                </div>
            );
        };

        const StaffPortal = ({ stats, schedules, rosters, adAccounts, role, userSchool, onSave, onDelete }) => {
            const [tab, setTab] = useState('stats');
            const [form, setForm] = useState({ id: '', playerName: '', sport: 'Boys Basketball', category: 'Points', value: '', season: '2025-2026', school: role === 'ad' ? userSchool : SCHOOLS[0] });
            const [adForm, setAdForm] = useState({ id: '', school: SCHOOLS[0], email: '', password: '', status: 'active' });

            const submitStat = (e) => {
                e.preventDefault();
                onSave('stats', form);
                setForm({...form, id: '', playerName: '', value: ''});
            };

            const submitAd = (e) => {
                e.preventDefault();
                onSave('adAccounts', adForm);
                setAdForm({ id: '', school: SCHOOLS[0], email: '', password: '', status: 'active' });
            };

            const filteredStats = role === 'admin' ? stats : stats.filter(s => s.school === userSchool);

            return (
                <div className="p-4 sm:p-8 max-w-6xl mx-auto">
                    <div className="flex gap-4 mb-8">
                        <button onClick={() => setTab('stats')} className={`px-4 py-2 font-bold rounded ${tab === 'stats' ? 'bg-blue-900 text-white' : 'bg-white border'}`}>Stats Manager</button>
                        {role === 'admin' && <button onClick={() => setTab('ads')} className={`px-4 py-2 font-bold rounded ${tab === 'ads' ? 'bg-blue-900 text-white' : 'bg-white border'}`}>AD Accounts</button>}
                    </div>

                    {tab === 'stats' && (
                        <div className="space-y-8">
                            <form onSubmit={submitStat} className="bg-white p-6 rounded-xl shadow-md grid grid-cols-1 md:grid-cols-4 gap-4">
                                <input className="border p-2 rounded font-semibold" placeholder="Player Name" value={form.playerName} onChange={e => setForm({...form, playerName: e.target.value})} required />
                                <select className="border p-2 rounded font-semibold" value={form.sport} onChange={e => setForm({...form, sport: e.target.value})}>
                                    {Object.keys(SPORTS_CATEGORIES).map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                                <input className="border p-2 rounded font-semibold" type="number" placeholder="Value" value={form.value} onChange={e => setForm({...form, value: e.target.value})} required />
                                <button className="bg-blue-600 text-white font-black uppercase rounded py-2">Publish</button>
                            </form>
                            <div className="bg-white rounded-xl shadow-md overflow-hidden">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-gray-50 border-b">
                                        <tr><th className="p-4">Player</th><th className="p-4">Sport</th><th className="p-4">Cat</th><th className="p-4">Val</th><th className="p-4"></th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {filteredStats.map(s => (
                                            <tr key={s.id} className="hover:bg-gray-50">
                                                <td className="p-4 font-bold">{s.playerName}</td>
                                                <td className="p-4 text-xs uppercase font-black text-gray-400">{s.sport}</td>
                                                <td className="p-4">{s.category}</td>
                                                <td className="p-4 font-black">{s.value}</td>
                                                <td className="p-4 text-right"><button onClick={() => onDelete('stats', s.id)} className="text-red-600 font-bold"><Icon name="trash-can" /></button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {tab === 'ads' && role === 'admin' && (
                        <div className="space-y-8">
                            <form onSubmit={submitAd} className="bg-white p-6 rounded-xl shadow-md grid grid-cols-1 md:grid-cols-3 gap-4">
                                <select className="border p-2 rounded" value={adForm.school} onChange={e => setAdForm({...adForm, school: e.target.value})}>{SCHOOLS.map(s => <option key={s} value={s}>{s}</option>)}</select>
                                <input className="border p-2 rounded" placeholder="AD Email" value={adForm.email} onChange={e => setAdForm({...adForm, email: e.target.value})} required />
                                <div className="flex gap-2">
                                    <input className="border p-2 rounded flex-1" placeholder="Password" value={adForm.password} onChange={e => setAdForm({...adForm, password: e.target.value})} required />
                                    <button type="button" onClick={() => setAdForm({...adForm, password: Math.random().toString(36).slice(-8)})} className="bg-gray-200 px-3 rounded font-bold">Gen</button>
                                </div>
                                <button className="md:col-span-3 bg-blue-900 text-white font-black uppercase py-2 rounded">Create Account</button>
                            </form>
                            <div className="bg-white rounded-xl shadow-md overflow-hidden">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-gray-50 border-b"><tr><th className="p-4">School</th><th className="p-4">Email</th><th className="p-4">Password</th><th className="p-4">Status</th></tr></thead>
                                    <tbody className="divide-y">
                                        {adAccounts.map(a => (
                                            <tr key={a.id}>
                                                <td className="p-4 font-black text-blue-900">{a.school}</td>
                                                <td className="p-4 text-blue-600 font-bold underline">{a.email}</td>
                                                <td className="p-4 font-mono">{a.password}</td>
                                                <td className="p-4"><span className="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-black uppercase">{a.status}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SmartImportView = ({ userSchool, onBatch }) => {
            const [text, setText] = useState('');
            const [loading, setLoading] = useState(false);
            const [sport, setSport] = useState("Boys Basketball");
            const [extracted, setExtracted] = useState(null);

            const handleAI = async () => {
                setLoading(true);
                const apiKey = ""; // Insert your key here!
                const prompt = `Extract player names and their stats for ${sport}. Return ONLY a JSON array of objects with playerName and stats object. Use these categories if found: ${SPORTS_CATEGORIES[sport].join(', ')}. Data: ${text}`;
                
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await res.json();
                    const clean = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '');
                    const parsed = JSON.parse(clean);
                    let flat = [];
                    parsed.forEach(p => {
                        Object.entries(p.stats).forEach(([k, v]) => {
                            flat.push({ playerName: p.playerName, category: k, value: v, school: userSchool, sport: sport, season: '2025-2026' });
                        });
                    });
                    setExtracted(flat);
                } catch (e) { alert("AI Processing failed. Check your API key."); }
                setLoading(false);
            };

            return (
                <div className="p-4 sm:p-8 max-w-4xl mx-auto">
                    <h2 className="text-3xl font-extrabold text-blue-900 mb-6 uppercase">AI Smart Import</h2>
                    <div className="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                        <select className="w-full border p-3 rounded mb-4 font-bold" value={sport} onChange={e => setSport(e.target.value)}>{Object.keys(SPORTS_CATEGORIES).map(s => <option key={s} value={s}>{s}</option>)}</select>
                        <textarea className="w-full border p-4 rounded min-h-[250px] mb-4 text-sm" placeholder="Paste box score or season recap here..." value={text} onChange={e => setText(e.target.value)} />
                        <button onClick={handleAI} disabled={loading || !text} className="w-full bg-blue-900 text-white font-black py-4 rounded uppercase tracking-widest disabled:opacity-50">
                            {loading ? <Icon name="spinner" className="animate-spin mr-2"/> : <Icon name="wand-magic-sparkles" className="mr-2"/>}
                            Analyze with SportzWire AI
                        </button>
                    </div>

                    {extracted && (
                        <div className="mt-8 bg-white p-6 rounded-xl shadow-md border-t-8 border-green-500">
                            <h3 className="font-black text-lg mb-4">Review Extracted Records ({extracted.length})</h3>
                            <div className="max-h-[300px] overflow-y-auto mb-6 border rounded p-2">
                                {extracted.map((e, i) => <div key={i} className="text-sm py-1 border-b last:border-0">{e.playerName}: <b>{e.value}</b> {e.category}</div>)}
                            </div>
                            <button onClick={() => {onBatch(extracted); setExtracted(null); setText('');}} className="w-full bg-green-600 text-white font-black py-4 rounded uppercase">Commit to District 2 Database</button>
                        </div>
                    )}
                </div>
            );
        };

        // --- Auth & Main ---

        function App() {
            const [view, setView] = useState('home');
            const [user, setUser] = useState(null);
            const [stats, setStats] = useState([]);
            const [schedules, setSchedules] = useState([]);
            const [rosters, setRosters] = useState([]);
            const [adAccounts, setAdAccounts] = useState([]);
            const [modal, setModal] = useState(false);
            const [email, setEmail] = useState('');
            const [pass, setPass] = useState('');

            const { initializeApp, getAuth, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc } = window.FirebaseSDK;
            const db = getFirestore(initializeApp(firebaseConfig));
            const auth = getAuth();

            useEffect(() => {
                signInAnonymously(auth);
                onAuthStateChanged(auth, u => setUser(u));
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub1 = onSnapshot(collection(db, 'stats'), s => setStats(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub2 = onSnapshot(collection(db, 'schedules'), s => setSchedules(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub3 = onSnapshot(collection(db, 'rosters'), s => setRosters(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub4 = onSnapshot(collection(db, 'adAccounts'), s => setAdAccounts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const login = async (e) => {
                e.preventDefault();
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                    setModal(false);
                } catch (err) {
                    if (email === 'admin@sportzwire.com') {
                        await createUserWithEmailAndPassword(auth, email, pass);
                        setModal(false);
                    } else {
                        alert("Invalid login details.");
                    }
                }
            };

            const handleSave = async (col, d) => await addDoc(collection(db, col), d);
            const handleDelete = async (col, id) => await deleteDoc(doc(db, col, id));
            const handleBatch = async (arr) => {
                await Promise.all(arr.map(a => addDoc(collection(db, 'stats'), a)));
                alert("Stats Synchronized!");
            };

            let role = 'public';
            let school = SCHOOLS[0];
            if (user && !user.isAnonymous) {
                if (user.email === 'admin@sportzwire.com') role = 'admin';
                else {
                    const match = adAccounts.find(a => a.email.toLowerCase() === user.email.toLowerCase());
                    if (match) { role = 'ad'; school = match.school; }
                }
            }

            return (
                <div className="min-h-screen flex flex-col pb-20 md:pb-0">
                    <nav className="bg-blue-900 text-white p-4 shadow-xl border-b-4 border-yellow-400">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer mb-4 md:mb-0" onClick={() => setView('home')}>
                                <div className="bg-yellow-400 p-2 rounded-lg text-blue-900"><Icon name="trophy" size={24} /></div>
                                <div className="leading-none">
                                    <span className="text-2xl font-black italic uppercase tracking-tighter">SportzWire</span>
                                    <p className="text-[10px] font-bold text-blue-300 uppercase tracking-widest">District 2 Stats Hub</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-1 md:gap-4 font-black uppercase text-xs">
                                <button onClick={() => setView('home')} className={`px-3 py-2 rounded ${view === 'home' ? 'bg-blue-800' : 'hover:bg-blue-800'}`}>School Stats</button>
                                <button onClick={() => setView('top20')} className={`px-3 py-2 rounded ${view === 'top20' ? 'bg-blue-800' : 'hover:bg-blue-800'}`}>Top 20</button>
                                {role !== 'public' && (
                                    <>
                                        <button onClick={() => setView('import')} className={`px-3 py-2 rounded text-green-400 ${view === 'import' ? 'bg-blue-800' : ''}`}>AI Import</button>
                                        <button onClick={() => setView('staff')} className={`px-3 py-2 rounded text-blue-300 ${view === 'staff' ? 'bg-blue-800' : ''}`}>Portal</button>
                                    </>
                                )}
                                {user && !user.isAnonymous ? 
                                    <button onClick={() => signOut(auth)} className="bg-red-600 px-4 py-2 rounded shadow-md ml-2">Logout</button> :
                                    <button onClick={() => setModal(true)} className="bg-yellow-400 text-blue-900 px-4 py-2 rounded shadow-md ml-2">Staff Login</button>
                                }
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow bg-gray-50">
                        {view === 'home' && <SchoolLookupView stats={stats} schedules={schedules} />}
                        {view === 'top20' && <Top20View stats={stats} />}
                        {view === 'import' && <SmartImportView userSchool={school} onBatch={handleBatch} />}
                        {view === 'staff' && <StaffPortal stats={stats} schedules={schedules} adAccounts={adAccounts} role={role} userSchool={school} onSave={handleSave} onDelete={handleDelete} />}
                    </main>

                    {modal && (
                        <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-[100]">
                            <div className="bg-white p-8 rounded-2xl max-w-sm w-full shadow-2xl">
                                <h2 className="text-3xl font-black text-blue-900 mb-6 uppercase tracking-tighter">Portal Access</h2>
                                <form onSubmit={login} className="space-y-4">
                                    <input className="w-full border p-3 rounded-lg font-semibold" type="email" placeholder="Email Address" value={email} onChange={e => setEmail(e.target.value)} required />
                                    <input className="w-full border p-3 rounded-lg font-semibold" type="password" placeholder="Password" value={pass} onChange={e => setPass(e.target.value)} required />
                                    <button className="w-full bg-blue-900 text-white font-black py-4 rounded-lg uppercase tracking-widest hover:bg-blue-800 transition-all">Sign In Securely</button>
                                    <button type="button" onClick={() => setModal(false)} className="w-full text-gray-400 font-bold uppercase text-xs">Cancel</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
